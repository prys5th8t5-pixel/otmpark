<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personvernerklæring – OTMPark</title>
<meta name="description" content="Slik behandler OTMPark personopplysninger: skiltgjenkjenning, betaling, e-faktura, forespørsler og dine rettigheter.">
<style>
:root{--ink:#EDE8DF;--ink2:#C8C2B7;--mut:#9C978D;--line:rgba(237,232,223,.10);--bg:#0D1015;--surf:#181E26;--blue:#C2A36B;--on-acc:#14110B;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--blue);color:var(--on-acc)}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.1}p{margin:0}a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.kicker{font-size:12.5px;font-weight:600;color:var(--blue);margin-bottom:14px;text-transform:uppercase;letter-spacing:.16em}
.bar{position:sticky;top:0;z-index:5;background:rgba(13,16,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:21px;letter-spacing:-.03em}
.logo .p{width:32px;height:32px;border-radius:6px;background:var(--blue);color:var(--on-acc);display:grid;place-items:center;font-size:21px;font-weight:800;box-shadow:inset 0 0 0 2px #0D1015,0 0 0 1.5px var(--blue)}
.back{font-size:14.5px;font-weight:600;text-decoration:none;border:1px solid rgba(237,232,223,.3);border-radius:999px;padding:9px 18px}
.back:hover{border-color:var(--blue);color:var(--blue)}
main{padding:64px 32px 110px}
footer{border-top:1px solid var(--line);background:#08090C;color:#80848c;font-size:13px;padding:28px 0}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:760px){.wrap{padding:0 20px}main{padding:40px 20px 80px}body{font-size:16px}}
{{PV_CSS}}
</style>
</head>
<body>
<div class="bar"><div class="wrap"><a class="logo" href="./"><span class="p">P</span>OTMPark</a><a class="back" href="./">← Til forsiden</a></div></div>
<main>
{{PV_BODY}}
</main>
<footer><div class="wrap"><span>[Selskapsnavn AS] · Org.nr. [org.nr.] · <a href="mailto:OTMPark@proton.me">OTMPark@proton.me</a></span><span>© 2026 OTMPark (arbeidsnavn)</span></div></footer>
</body>
</html>
